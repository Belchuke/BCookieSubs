[project]
name = "bcookiesubs-worker"
version = "1.0.0"
description = "BCookieSubs Python compute worker (gRPC outbound)"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.68.0",
    "protobuf>=5.28.0",
    "faster-whisper>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bcookiesubs_worker", "bcookiesubs_worker.generated"]