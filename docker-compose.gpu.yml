# Override file enabling NVIDIA GPU passthrough for the dockerised Ollama
# and the Whisper transcription service inside the app container.
# Used with `setup-with-gpu.sh` or:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires nvidia-container-toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/

services:
  app:
    environment:
      WHISPER_GPU_AVAILABLE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
