# BCookieSubs — docker-compose for macOS
#
# This variant skips the dockerised Ollama and uses a native Ollama running
# on the Mac host instead. Native Ollama uses Apple Metal for GPU acceleration,
# which is impossible inside Docker Desktop on macOS (the Linux VM has no GPU
# passthrough — neither for NVIDIA nor for Apple Silicon).
#
# Quick start:
#   1. Install Ollama on the host so it runs as a background service:
#        Option A:  brew install ollama && brew services start ollama
#        Option B:  download the Ollama .dmg from https://ollama.com
#                   (it installs as a menu-bar app that auto-starts at login)
#      Either way you get a permanent http://localhost:11434 — no terminal needed.
#   2. Copy .env.example -> .env and fill in values you want.
#   3. Edit MEDIA_HOST_DIR in .env to point at your media library.
#   4. `docker compose -f docker-compose.macos.yml up -d`
#   5. Browse http://localhost:4850
#
# How the app reaches Ollama:
#   `host.docker.internal` is Docker Desktop's magic DNS name that resolves
#   to the Mac host from inside any container. The app container talks to the
#   native Ollama at http://host.docker.internal:11434.

services:
  app:
    build: .
    image: bcookiesubs:latest
    pull_policy: build
    container_name: bcookiesubs-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4850}:4850"
    # Required so host.docker.internal works on every Docker Desktop variant
    # (Docker Desktop adds this automatically, but listing it makes it portable
    # to OrbStack / Colima / Rancher Desktop without surprises).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "4850"
      DBPATH: "/data/subtitles.db"
      DISABLE_OLLAMA_SPAWN: "1"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      AES_KEY: "${AES_KEY}"
      THEMOVIEDB_API_KEY: "${THEMOVIEDB_API_KEY:-}"
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # See docker-compose.yml for why this mirrors the host path.
      TRANSLATION_ROOT_DIR: "${TRANSLATION_ROOT_DIR:-/media}"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-}"
    volumes:
      - app-data:/data
      - "${TRANSLATION_ROOT_DIR:-./media}:${TRANSLATION_ROOT_DIR:-/media}"

volumes:
  app-data:
